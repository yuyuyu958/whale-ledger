<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#081027" />
  <meta name="description" content="鲸迹 · 一款住在星海里的温柔记账本。支持 iOS 添加到主屏幕、AI 对话分析账单、预算守卫与周期账单。" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="鲸迹" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="color-scheme" content="dark" />
  <title>鲸迹 · 温柔记账</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />

  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
/* =========================================================
   鲸迹 · Whale Ledger
   深海星空 / 蓝鲸女仆 / 奶油蕾丝
   ========================================================= */

:root {
  --bg: #070d1e;
  --bg-deep: #050a17;
  --bg-soft: #0b1530;
  --panel: #111c38;
  --panel-2: #162342;
  --panel-3: #1b2a4d;
  --line: rgba(173, 195, 255, 0.12);
  --line-strong: rgba(173, 195, 255, 0.22);
  --text: #f4f6fd;
  --muted: #9aa8c9;
  --muted-2: #7180a4;
  --accent: #a9c2ff;
  --accent-strong: #7f9ff0;
  --accent-deep: #5d7ed6;
  --cream: #f6f1e7;
  --pink: #ffadc0;
  --mint: #7de3d0;
  --gold: #ffd98e;
  --danger: #ff8fa3;
  --radius-xl: 28px;
  --radius-lg: 22px;
  --radius-md: 16px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --tab-height: 68px;
  --tab-space: calc(84px + var(--safe-bottom));
  --ease-spring: cubic-bezier(0.22, 1.18, 0.36, 1);
  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
  color-scheme: dark;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background:
    radial-gradient(ellipse 80% 60% at 50% -5%, #15234a 0%, transparent 58%),
    radial-gradient(ellipse 60% 50% at 90% 95%, #101a37 0%, transparent 65%),
    var(--bg-deep);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
    "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  overscroll-behavior: none;
}

button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}

button {
  border: 0;
  background: none;
  cursor: pointer;
  padding: 0;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

button:disabled {
  cursor: default;
  opacity: 0.55;
}

input,
textarea {
  border: 0;
  outline: 0;
  background: transparent;
  border-radius: 0;
  -webkit-appearance: none;
  appearance: none;
}

input::placeholder,
textarea::placeholder {
  color: var(--muted-2);
}

h1, h2, h3, h4, p {
  margin: 0;
}

a {
  color: inherit;
  text-decoration: none;
}

img {
  display: block;
  max-width: 100%;
}

.svg-sprite {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
  pointer-events: none;
}

.icon {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: 0 0 auto;
}

.icon-sm {
  width: 17px;
  height: 17px;
  stroke-width: 1.8;
}

.icon-xs {
  width: 14px;
  height: 14px;
  stroke-width: 2;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.noscript {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: var(--bg);
  z-index: 999;
  padding: 24px;
  text-align: center;
}

/* ---------- 外部星海背景 ---------- */

.ambient {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.ambient-glow {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.5;
}

.glow-a {
  width: 42vw;
  height: 42vw;
  min-width: 340px;
  min-height: 340px;
  top: -14%;
  left: -8%;
  background: #223c78;
}

.glow-b {
  width: 34vw;
  height: 34vw;
  min-width: 280px;
  min-height: 280px;
  right: -8%;
  bottom: -8%;
  background: #213c6d;
  opacity: 0.35;
}

.ambient-orbit {
  position: absolute;
  border: 1px solid rgba(169, 194, 255, 0.12);
  border-radius: 50%;
}

.orbit-a {
  width: 900px;
  height: 900px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-18deg) scaleY(0.72);
}

.orbit-b {
  width: 1180px;
  height: 1180px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(22deg) scaleY(0.62);
  opacity: 0.55;
}

/* ---------- 桌面品牌区 ---------- */

.desktop-brand {
  display: none;
}

/* ---------- App 外壳 ---------- */

.app-shell {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  height: 100vh;
  height: 100dvh;
  margin: 0 auto;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(ellipse 120% 60% at 12% -8%, rgba(64, 91, 161, 0.35), transparent 55%),
    radial-gradient(ellipse 80% 46% at 95% 102%, rgba(39, 68, 125, 0.5), transparent 65%),
    linear-gradient(176deg, #0a142c 0%, #081021 52%, #060c1b 100%);
}

.shell-rim {
  position: absolute;
  inset: 0;
  z-index: 9;
  pointer-events: none;
  border-radius: inherit;
  box-shadow:
    inset 0 0 0 1px rgba(190, 208, 255, 0.09),
    inset 0 1px 0 rgba(255, 255, 255, 0.04);
}

.screens {
  position: absolute;
  inset: 0;
  z-index: 2;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
  overflow-y: auto;
  overflow-x: hidden;
  padding: calc(18px + var(--safe-top)) 20px var(--tab-space);
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
}

.screen::-webkit-scrollbar {
  display: none;
}

.screen.active {
  display: block;
  animation: screenIn 0.42s var(--ease-out) both;
}

.screen[data-screen="assistant"].active {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding: calc(10px + var(--safe-top)) 0 var(--tab-space);
}

@keyframes screenIn {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- 星空 ---------- */

.starfield {
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

.star {
  position: absolute;
  border-radius: 50%;
  background: #eaf1ff;
  opacity: 0;
  animation: twinkle var(--dur, 4s) ease-in-out infinite;
  animation-delay: var(--delay, 0s);
}

.star::after {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(219, 231, 255, 0.32), transparent 70%);
}

@keyframes twinkle {
  0%, 100% { opacity: 0.18; transform: scale(0.8); }
  48% { opacity: var(--peak, 0.8); transform: scale(1); }
}

.shooting-star {
  position: absolute;
  top: 13%;
  right: 12%;
  width: 64px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(231, 239, 255, 0.8));
  transform: rotate(-32deg);
  opacity: 0;
  animation: shoot 9s ease-in infinite;
  animation-delay: 4s;
}

.shooting-star::after {
  content: "";
  position: absolute;
  right: -1px;
  top: -1px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 8px #cfe0ff;
}

@keyframes shoot {
  0%, 86% { opacity: 0; transform: translate(0, 0) rotate(-32deg); }
  89% { opacity: 1; }
  96%, 100% { opacity: 0; transform: translate(-150px, 94px) rotate(-32deg); }
}

/* ---------- 通用头部 ---------- */

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}

.brand-lockup {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}

.avatar-ring {
  position: relative;
  width: 44px;
  height: 44px;
  flex: 0 0 auto;
  border-radius: 50%;
  padding: 2px;
  background: conic-gradient(from 210deg, rgba(255, 217, 142, 0.9), rgba(155, 186, 255, 0.9), rgba(125, 227, 208, 0.6), rgba(255, 217, 142, 0.9));
  box-shadow: 0 0 18px rgba(133, 166, 255, 0.28);
}

.avatar-ring img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #0b142a;
}

.avatar-ring::after {
  content: "";
  position: absolute;
  right: 1px;
  bottom: 2px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--mint);
  border: 2px solid #0a132a;
  box-shadow: 0 0 8px var(--mint);
}

.hello-copy {
  min-width: 0;
}

.hello-kicker {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 11.5px;
  letter-spacing: 0.04em;
}

.hello-kicker .wave {
  display: inline-block;
  animation: gentleWave 3.4s ease-in-out infinite;
  transform-origin: 70% 70%;
}

@keyframes gentleWave {
  0%, 55%, 100% { transform: rotate(0); }
  62% { transform: rotate(14deg); }
  70% { transform: rotate(-6deg); }
  78% { transform: rotate(10deg); }
}

.hello-title {
  font-size: 19px;
  font-weight: 650;
  letter-spacing: -0.02em;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hello-title em {
  font-style: normal;
  color: var(--accent);
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  background: rgba(20, 33, 63, 0.58);
  border: 1px solid var(--line);
  transition: transform 0.18s var(--ease-out), background 0.18s ease, color 0.18s ease;
}

.icon-btn:active {
  transform: scale(0.93);
  background: rgba(35, 54, 95, 0.8);
  color: var(--text);
}

.icon-btn.accent {
  color: var(--accent);
}

/* ---------- 余额卡 ---------- */

.balance-card {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-xl);
  padding: 20px 20px 18px;
  background:
    radial-gradient(circle at 88% 18%, rgba(127, 159, 240, 0.3), transparent 42%),
    radial-gradient(circle at 4% 112%, rgba(125, 227, 208, 0.09), transparent 45%),
    linear-gradient(138deg, #1b2d55 0%, #121f3e 51%, #101a35 100%);
  border: 1px solid rgba(174, 198, 255, 0.17);
  box-shadow:
    0 24px 48px -22px rgba(0, 0, 0, 0.8),
    inset 0 1px 0 rgba(255, 255, 255, 0.07);
  min-height: 198px;
  isolation: isolate;
}

.balance-card::before {
  content: "";
  position: absolute;
  width: 310px;
  height: 310px;
  border-radius: 50%;
  border: 1px solid rgba(191, 210, 255, 0.12);
  top: -162px;
  right: -98px;
  transform: rotate(-16deg) scaleY(0.78);
  pointer-events: none;
}

.balance-card::after {
  content: "";
  position: absolute;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  border: 1px dashed rgba(191, 210, 255, 0.09);
  top: -108px;
  right: -53px;
}

.hero-mascot {
  position: absolute;
  right: -18px;
  bottom: -35px;
  width: 164px;
  height: 164px;
  border-radius: 50%;
  overflow: hidden;
  opacity: 0.4;
  filter: saturate(1.08);
  -webkit-mask-image: radial-gradient(circle at 50% 46%, #000 36%, rgba(0, 0, 0, 0.7) 56%, transparent 72%);
  mask-image: radial-gradient(circle at 50% 46%, #000 36%, rgba(0, 0, 0, 0.7) 56%, transparent 72%);
  pointer-events: none;
  z-index: 0;
}

.hero-mascot img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.balance-top {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #bdcbea;
  font-size: 12px;
  letter-spacing: 0.06em;
}

.eyebrow .star-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 9px var(--gold);
}

.mini-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  color: #ced9f4;
  padding: 4px 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.08);
  white-space: nowrap;
}

.balance-amount {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-top: 10px;
  letter-spacing: -0.035em;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}

.balance-amount .currency {
  font-size: 21px;
  font-weight: 500;
  color: #dbe5fb;
  transform: translateY(-5px);
}

.balance-amount .value {
  font-size: clamp(35px, 10vw, 41px);
  font-weight: 680;
  line-height: 1.08;
  color: #fbfcff;
  text-shadow: 0 3px 24px rgba(162, 188, 255, 0.2);
}

.balance-amount .decimal {
  font-size: 21px;
  font-weight: 580;
  color: #c9d6f0;
}

.hero-stats {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: stretch;
  gap: 10px;
  margin-top: 20px;
  max-width: 78%;
}

.hero-stat {
  flex: 1;
  min-width: 0;
  padding: 9px 11px;
  border-radius: 13px;
  background: rgba(7, 14, 32, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.07);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.hero-stat-label {
  display: flex;
  align-items: center;
  gap: 4px;
  color: #9fadd0;
  font-size: 10.5px;
  white-space: nowrap;
}

.hero-stat-value {
  display: block;
  margin-top: 3px;
  font-size: 14px;
  font-weight: 620;
  color: #eff3fd;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
}

.hero-stat.income .hero-stat-value { color: #a8f4e5; }
.hero-stat.expense .hero-stat-value { color: #ffc0ce; }

/* ---------- 快捷操作 ---------- */

.quick-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 16px 0 20px;
}

.quick-action {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 12px 4px 10px;
  border-radius: 17px;
  color: var(--muted);
  font-size: 11.5px;
  background: rgba(20, 33, 63, 0.4);
  border: 1px solid rgba(173, 195, 255, 0.08);
  transition: transform 0.18s var(--ease-out), background 0.18s ease;
}

.quick-action:active {
  transform: scale(0.95);
  background: rgba(32, 49, 88, 0.62);
}

.quick-icon {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  color: var(--quick-color, var(--accent));
  background: var(--quick-bg, rgba(143, 185, 255, 0.12));
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.quick-icon .icon {
  width: 19px;
  height: 19px;
}

/* ---------- 卡片与分区 ---------- */

.card {
  position: relative;
  border-radius: var(--radius-lg);
  background:
    linear-gradient(155deg, rgba(25, 40, 75, 0.92), rgba(15, 26, 51, 0.94));
  border: 1px solid var(--line);
  box-shadow: 0 18px 36px -26px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.035);
}

.section {
  margin-bottom: 22px;
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 2px;
  margin-bottom: 11px;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 14.5px;
  font-weight: 620;
  letter-spacing: -0.01em;
  color: #e8edf9;
}

.section-title .icon {
  color: var(--accent);
  width: 16px;
  height: 16px;
}

.section-sub {
  color: var(--muted-2);
  font-size: 11px;
}

.section-link {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  color: var(--muted);
  font-size: 11.5px;
  padding: 4px 2px;
  transition: color 0.18s ease;
}

.section-link:active {
  color: var(--accent);
}

.section-link .icon {
  width: 13px;
  height: 13px;
}

.card-pad {
  padding: 16px;
}

/* ---------- 预算卡 ---------- */

.budget-card {
  padding: 16px 17px 15px;
  overflow: hidden;
}

.budget-card::after {
  content: "";
  position: absolute;
  right: -25px;
  top: -40px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 217, 142, 0.1), transparent 65%);
  pointer-events: none;
}

.budget-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.budget-label {
  display: flex;
  align-items: center;
  gap: 8px;
}

.budget-badge {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: var(--gold);
  background: rgba(255, 217, 142, 0.11);
  border: 1px solid rgba(255, 217, 142, 0.12);
}

.budget-badge .icon {
  width: 16px;
  height: 16px;
}

.budget-title {
  font-size: 13px;
  font-weight: 600;
}

.budget-caption {
  font-size: 10.5px;
  color: var(--muted-2);
  margin-top: 1px;
}

.budget-amounts {
  margin-top: 13px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}

.budget-spent {
  font-size: 22px;
  font-weight: 650;
  color: #f3f6ff;
  letter-spacing: -0.025em;
  font-variant-numeric: tabular-nums;
}

.budget-spent small {
  font-size: 11px;
  font-weight: 400;
  color: var(--muted-2);
  letter-spacing: 0;
}

.budget-percent {
  font-size: 11px;
  color: var(--gold);
  background: rgba(255, 217, 142, 0.1);
  border: 1px solid rgba(255, 217, 142, 0.1);
  padding: 3px 8px;
  border-radius: 999px;
}

.budget-percent.warn {
  color: var(--pink);
  background: rgba(255, 173, 192, 0.1);
  border-color: rgba(255, 173, 192, 0.12);
}

.budget-track {
  position: relative;
  height: 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.075);
  margin-top: 12px;
  overflow: hidden;
}

.budget-fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: var(--pct, 0%);
  max-width: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #c4b0ff, #ffd98e 78%, #ffb08f);
  box-shadow: 0 0 16px rgba(255, 217, 142, 0.22);
  transition: width 0.7s var(--ease-out);
}

.budget-fill.over {
  background: linear-gradient(90deg, #ffb08f, #ff8fa3);
}

.budget-foot {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 9px;
  font-size: 10.5px;
  color: var(--muted-2);
}

.budget-foot strong {
  color: #d9e2f7;
  font-weight: 500;
}

/* ---------- 鲸鲸洞察 ---------- */

.whale-note {
  display: flex;
  gap: 11px;
  padding: 14px;
  border-radius: var(--radius-lg);
  background:
    radial-gradient(circle at 100% 0, rgba(143, 185, 255, 0.15), transparent 45%),
    rgba(19, 33, 62, 0.82);
  border: 1px solid rgba(173, 195, 255, 0.13);
  align-items: flex-start;
  width: 100%;
  text-align: left;
  transition: transform 0.18s var(--ease-out);
}

.whale-note:active {
  transform: scale(0.985);
}

.note-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.16);
  flex: 0 0 auto;
  box-shadow: 0 0 16px rgba(123, 155, 240, 0.22);
}

.note-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.note-copy {
  flex: 1;
  min-width: 0;
}

.note-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  color: var(--accent);
  letter-spacing: 0.05em;
  margin-bottom: 3px;
}

.note-label::after {
  content: "";
  width: 18px;
  height: 1px;
  background: linear-gradient(90deg, rgba(169, 194, 255, 0.6), transparent);
}

.note-text {
  font-size: 12px;
  line-height: 1.68;
  color: #c6d2ea;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.note-cta {
  align-self: center;
  color: var(--accent);
  flex: 0 0 auto;
}

.note-cta .icon {
  width: 16px;
  height: 16px;
}

/* ---------- 迷你概览 ---------- */

.overview-card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 15px 16px;
}

.mini-donut {
  position: relative;
  width: 80px;
  height: 80px;
  flex: 0 0 auto;
}

.mini-donut svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.mini-donut .donut-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
}

.mini-donut .donut-value {
  font-size: 12.5px;
  font-weight: 650;
  color: #f1f5ff;
  letter-spacing: -0.02em;
}

.mini-donut .donut-label {
  font-size: 8.5px;
  color: var(--muted-2);
}

.overview-list {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.overview-row {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11.5px;
}

.overview-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex: 0 0 auto;
}

.overview-name {
  color: var(--muted);
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.overview-value {
  color: #e6ecfa;
  font-variant-numeric: tabular-nums;
  font-size: 11.5px;
}

.overview-empty {
  color: var(--muted-2);
  font-size: 12px;
}

/* ---------- 交易列表 ---------- */

.txn-card {
  overflow: hidden;
}

.txn-day + .txn-day {
  border-top: 1px solid rgba(173, 195, 255, 0.08);
}

.txn-day-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 15px 4px;
  font-size: 10.5px;
  color: var(--muted-2);
}

.txn-day-total {
  font-variant-numeric: tabular-nums;
}

.txn-row {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 10px 15px;
  text-align: left;
  transition: background 0.16s ease;
}

.txn-row:active {
  background: rgba(255, 255, 255, 0.035);
}

.txn-row + .txn-row {
  border-top: 1px solid rgba(173, 195, 255, 0.055);
}

.txn-icon {
  width: 40px;
  height: 40px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  color: var(--cat-color, var(--accent));
  background: var(--cat-soft, rgba(169, 194, 255, 0.12));
  border: 1px solid rgba(255, 255, 255, 0.045);
}

.txn-icon .icon {
  width: 19px;
  height: 19px;
}

.txn-main {
  flex: 1;
  min-width: 0;
}

.txn-title {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13.5px;
  font-weight: 520;
  color: #e9eefb;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.txn-sub {
  display: block;
  margin-top: 1px;
  font-size: 10.5px;
  color: var(--muted-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.txn-amount {
  flex: 0 0 auto;
  font-size: 14px;
  font-weight: 590;
  letter-spacing: -0.015em;
  color: #eef2fc;
  font-variant-numeric: tabular-nums;
}

.txn-amount.income {
  color: var(--mint);
}

.txn-tag {
  display: inline-flex;
  align-items: center;
  padding: 1px 5px;
  border-radius: 5px;
  font-size: 8.5px;
  color: var(--gold);
  background: rgba(255, 217, 142, 0.08);
  border: 1px solid rgba(255, 217, 142, 0.1);
}

.view-all {
  width: 100%;
  padding: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: var(--muted);
  font-size: 11.5px;
  border-top: 1px solid rgba(173, 195, 255, 0.08);
}

.view-all .icon {
  width: 13px;
  height: 13px;
}

/* ---------- 周期账单提醒 ---------- */

.recurring-strip {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 13px 14px;
  width: 100%;
  text-align: left;
}

.recurring-icon {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  color: var(--mint);
  background: rgba(125, 227, 208, 0.1);
  border: 1px solid rgba(125, 227, 208, 0.1);
  flex: 0 0 auto;
}

.recurring-icon .icon {
  width: 17px;
  height: 17px;
}

.recurring-copy {
  flex: 1;
  min-width: 0;
}

.recurring-title {
  font-size: 12.5px;
  color: #e9eefb;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.recurring-sub {
  font-size: 10.5px;
  color: var(--muted-2);
  margin-top: 1px;
}

.recurring-days {
  flex: 0 0 auto;
  font-size: 10.5px;
  color: var(--mint);
  padding: 3px 8px;
  border-radius: 999px;
  background: rgba(125, 227, 208, 0.08);
  border: 1px solid rgba(125, 227, 208, 0.1);
}

.recurring-days.soon {
  color: var(--gold);
  background: rgba(255, 217, 142, 0.08);
  border-color: rgba(255, 217, 142, 0.1);
}

/* ---------- 底部导航 ---------- */

.tabbar {
  position: absolute;
  z-index: 20;
  left: 14px;
  right: 14px;
  bottom: calc(12px + var(--safe-bottom));
  height: var(--tab-height);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: center;
  padding: 0 5px;
  border-radius: 25px;
  background: rgba(13, 23, 46, 0.86);
  border: 1px solid rgba(183, 203, 255, 0.14);
  box-shadow:
    0 18px 40px -16px rgba(0, 0, 0, 0.85),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(24px) saturate(1.3);
  -webkit-backdrop-filter: blur(24px) saturate(1.3);
}

.tab {
  position: relative;
  height: 54px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: #7e8db0;
  font-size: 9.5px;
  letter-spacing: 0.01em;
  border-radius: 17px;
  transition: color 0.2s ease, transform 0.18s var(--ease-out);
}

.tab:active {
  transform: scale(0.92);
}

.tab .icon {
  width: 21px;
  height: 21px;
  stroke-width: 1.65;
  transition: transform 0.22s var(--ease-spring);
}

.tab.active {
  color: var(--accent);
}

.tab.active .icon {
  transform: translateY(-1px) scale(1.04);
  filter: drop-shadow(0 0 8px rgba(169, 194, 255, 0.4));
}

.tab.active::after {
  content: "";
  position: absolute;
  bottom: 5px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 7px var(--accent);
}

.tab-add-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
}

.tab-add {
  position: relative;
  width: 50px;
  height: 50px;
  border-radius: 18px;
  display: grid;
  place-items: center;
  color: #0b1430;
  background: linear-gradient(145deg, #e4ecff 0%, #a9c2ff 42%, #7f9ff0 100%);
  box-shadow:
    0 10px 24px -6px rgba(116, 149, 240, 0.65),
    inset 0 1px 0 rgba(255, 255, 255, 0.7);
  transform: translateY(-11px);
  transition: transform 0.2s var(--ease-spring), box-shadow 0.2s ease;
}

.tab-add::before {
  content: "";
  position: absolute;
  inset: -5px;
  border-radius: 22px;
  border: 1px solid rgba(169, 194, 255, 0.2);
  opacity: 0.75;
}

.tab-add::after {
  content: "记一笔";
  position: absolute;
  top: 54px;
  font-size: 9.5px;
  color: var(--accent);
  white-space: nowrap;
  letter-spacing: 0.02em;
}

.tab-add .icon {
  width: 23px;
  height: 23px;
  stroke-width: 2;
}

.tab-add:active {
  transform: translateY(-8px) scale(0.94);
}

/* ---------- 账单页 ---------- */

.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 16px;
  padding-top: 2px;
}

.page-kicker {
  color: var(--muted-2);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 2px;
}

.page-title {
  font-size: 24px;
  font-weight: 680;
  letter-spacing: -0.04em;
  color: #f5f7fd;
  line-height: 1.25;
}

.page-title em {
  font-style: normal;
  color: var(--accent);
}

.page-subtitle {
  margin-top: 5px;
  color: var(--muted);
  font-size: 11.5px;
}

.month-picker {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 7px 8px;
  border-radius: 15px;
  background: rgba(22, 36, 68, 0.7);
  border: 1px solid var(--line);
  margin-bottom: 12px;
}

.month-arrow {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  color: var(--muted);
}

.month-arrow:active {
  background: rgba(255, 255, 255, 0.06);
}

.month-arrow:disabled {
  opacity: 0.25;
}

.month-arrow .icon {
  width: 17px;
  height: 17px;
}

.month-current {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  font-weight: 560;
  color: #e7edfa;
}

.month-current .tiny-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
}

.month-current button {
  font-size: 10px;
  color: var(--accent);
  padding: 2px 6px;
  border-radius: 6px;
  background: rgba(169, 194, 255, 0.09);
}

.bills-summary {
  display: grid;
  grid-template-columns: 1.25fr 1fr 1fr;
  gap: 1px;
  overflow: hidden;
  border-radius: var(--radius-lg);
  border: 1px solid var(--line);
  background: var(--line);
  margin-bottom: 13px;
}

.bills-summary-cell {
  padding: 13px 13px 12px;
  background: linear-gradient(155deg, rgba(25, 40, 75, 0.96), rgba(15, 26, 51, 0.98));
}

.bills-summary-label {
  font-size: 10px;
  color: var(--muted-2);
}

.bills-summary-value {
  margin-top: 3px;
  font-size: 15.5px;
  font-weight: 620;
  color: #edf2fc;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.bills-summary-value.expense { color: #ffc0ce; }
.bills-summary-value.income { color: var(--mint); }
.bills-summary-value.main { font-size: 18px; }

.search-row {
  position: relative;
  margin-bottom: 10px;
}

.search-row .icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: var(--muted-2);
  pointer-events: none;
}

.search-input {
  width: 100%;
  height: 42px;
  padding: 0 36px 0 37px;
  border-radius: 14px;
  background: rgba(21, 34, 64, 0.66);
  border: 1px solid var(--line);
  color: var(--text);
  font-size: 16px;
  transition: border-color 0.18s ease, background 0.18s ease;
}

.search-input:focus {
  border-color: rgba(169, 194, 255, 0.32);
  background: rgba(25, 41, 77, 0.8);
}

.search-clear {
  position: absolute;
  right: 7px;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--muted-2);
}

.chip-scroll {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 2px 1px 12px;
  margin: 0 -1px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.chip-scroll::-webkit-scrollbar {
  display: none;
}

.chip {
  flex: 0 0 auto;
  padding: 6px 11px;
  border-radius: 999px;
  font-size: 11px;
  color: var(--muted);
  background: rgba(22, 36, 68, 0.65);
  border: 1px solid var(--line);
  transition: all 0.16s ease;
  white-space: nowrap;
}

.chip.active {
  color: #0d1731;
  background: var(--accent);
  border-color: var(--accent);
  font-weight: 560;
}

.chip:active {
  transform: scale(0.96);
}

.filter-summary {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 2px 4px 8px;
  font-size: 10.5px;
  color: var(--muted-2);
}

/* ---------- 空状态 ---------- */

.empty-state {
  padding: 34px 22px 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 8px;
}

.empty-mascot {
  width: 86px;
  height: 86px;
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid rgba(169, 194, 255, 0.18);
  box-shadow: 0 0 30px rgba(101, 136, 224, 0.18);
  margin-bottom: 4px;
  opacity: 0.88;
}

.empty-mascot img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.empty-title {
  font-size: 13px;
  color: #dfe7f7;
}

.empty-desc {
  font-size: 11px;
  color: var(--muted-2);
  line-height: 1.65;
  max-width: 240px;
}

.empty-btn {
  margin-top: 6px;
  padding: 8px 16px;
  border-radius: 999px;
  color: var(--accent);
  font-size: 11.5px;
  background: rgba(169, 194, 255, 0.09);
  border: 1px solid rgba(169, 194, 255, 0.14);
}

/* ---------- 统计页 ---------- */

.segmented {
  display: flex;
  padding: 3px;
  border-radius: 12px;
  background: rgba(9, 18, 38, 0.5);
  border: 1px solid var(--line);
}

.segmented button {
  flex: 1;
  padding: 7px 10px;
  border-radius: 9px;
  font-size: 11px;
  color: var(--muted);
  transition: all 0.2s ease;
  white-space: nowrap;
}

.segmented button.active {
  color: #0d1731;
  background: var(--accent);
  font-weight: 560;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

.stats-donut-card {
  padding: 18px 16px 16px;
  margin-bottom: 13px;
}

.donut-wrap {
  display: flex;
  align-items: center;
  gap: 18px;
}

.donut-chart {
  position: relative;
  width: 142px;
  height: 142px;
  flex: 0 0 auto;
}

.donut-chart svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
  overflow: visible;
}

.donut-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
}

.donut-center-label {
  font-size: 9.5px;
  color: var(--muted-2);
  letter-spacing: 0.04em;
}

.donut-center-value {
  font-size: 17px;
  font-weight: 650;
  letter-spacing: -0.03em;
  color: #f2f6ff;
  font-variant-numeric: tabular-nums;
}

.donut-center-sub {
  font-size: 9px;
  color: var(--muted-2);
}

.donut-legend {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
}

.legend-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  flex: 0 0 auto;
}

.legend-name {
  color: var(--muted);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.legend-pct {
  color: #dce5f6;
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
}

.stats-total-line {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: 15px;
  padding-top: 13px;
  border-top: 1px solid rgba(173, 195, 255, 0.08);
  font-size: 10.5px;
  color: var(--muted-2);
}

.stats-total-line strong {
  font-size: 17px;
  font-weight: 630;
  color: #f0f4fd;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.stats-total-line .sep {
  flex: 1;
}

/* 趋势柱状图 */

.trend-card {
  padding: 16px;
  margin-bottom: 13px;
}

.chart-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 17px;
}

.chart-caption {
  font-size: 10.5px;
  color: var(--muted-2);
  margin-top: 3px;
}

.chart-legend-inline {
  display: flex;
  gap: 10px;
  font-size: 9.5px;
  color: var(--muted-2);
  align-items: center;
}

.chart-legend-inline span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.chart-legend-inline i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
}

/* 近 7 天 */

.day-bars {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  height: 128px;
  padding-top: 8px;
}

.day-bar-col {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  height: 100%;
  gap: 7px;
}

.day-bar-track {
  width: 100%;
  flex: 1;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.day-bar {
  width: 72%;
  max-width: 20px;
  min-height: 4px;
  border-radius: 6px 6px 3px 3px;
  background: linear-gradient(180deg, #b9cdff, #6e8fe2);
  box-shadow: 0 2px 12px rgba(125, 157, 240, 0.22);
  transform-origin: bottom;
  animation: growBar 0.65s var(--ease-out) both;
}

.day-bar.peak {
  background: linear-gradient(180deg, #ffe7b0, #ffc879);
  box-shadow: 0 2px 14px rgba(255, 205, 120, 0.26);
}

.day-bar-label {
  font-size: 9px;
  color: var(--muted-2);
  white-space: nowrap;
}

.day-bar-label.today {
  color: var(--accent);
}

@keyframes growBar {
  from { transform: scaleY(0.08); opacity: 0.4; }
  to { transform: scaleY(1); opacity: 1; }
}

/* 6 个月趋势 */

.month-bars {
  display: flex;
  align-items: flex-end;
  gap: 9px;
  height: 120px;
  padding-top: 7px;
}

.month-bar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  height: 100%;
  gap: 7px;
}

.month-bar-track {
  width: 100%;
  flex: 1;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.month-bar {
  width: 68%;
  max-width: 28px;
  min-height: 4px;
  border-radius: 7px 7px 3px 3px;
  background: linear-gradient(180deg, rgba(169, 194, 255, 0.95), rgba(97, 129, 208, 0.72));
  animation: growBar 0.65s var(--ease-out) both;
}

.month-bar.current {
  background: linear-gradient(180deg, #ffdc9a, #f0af6c);
}

.month-bar-label {
  font-size: 9.5px;
  color: var(--muted-2);
}

.month-bar-label.current {
  color: var(--gold);
}

/* 排名 */

.rank-list {
  padding: 6px 16px 10px;
}

.rank-row {
  padding: 11px 0;
}

.rank-row + .rank-row {
  border-top: 1px solid rgba(173, 195, 255, 0.06);
}

.rank-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 7px;
}

.rank-index {
  width: 17px;
  font-size: 9.5px;
  color: var(--muted-2);
  font-variant-numeric: tabular-nums;
}

.rank-name {
  flex: 1;
  font-size: 12px;
  color: #dfe6f4;
}

.rank-count {
  font-size: 9.5px;
  color: var(--muted-2);
}

.rank-amount {
  font-size: 12px;
  font-weight: 520;
  color: #e9eef9;
  font-variant-numeric: tabular-nums;
}

.rank-track {
  height: 4px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.05);
  margin-left: 25px;
  overflow: hidden;
}

.rank-fill {
  height: 100%;
  border-radius: inherit;
  background: var(--rank-color, var(--accent));
  opacity: 0.72;
  animation: growWidth 0.7s var(--ease-out) both;
}

@keyframes growWidth {
  from { width: 0 !important; }
}

/* ---------- AI 助手 ---------- */

.chat-header {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 4px 18px 12px;
  flex: 0 0 auto;
}

.chat-avatar {
  width: 43px;
  height: 43px;
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.18);
  box-shadow: 0 0 20px rgba(117, 151, 238, 0.22);
  flex: 0 0 auto;
}

.chat-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.chat-title-wrap {
  flex: 1;
  min-width: 0;
}

.chat-name {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 15px;
  font-weight: 620;
  color: #f2f5fd;
  letter-spacing: -0.01em;
}

.chat-name .ai-tag {
  font-size: 8px;
  font-weight: 500;
  color: var(--accent);
  padding: 1px 5px;
  border-radius: 5px;
  background: rgba(169, 194, 255, 0.1);
  border: 1px solid rgba(169, 194, 255, 0.12);
  letter-spacing: 0.04em;
}

.chat-status {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: var(--muted-2);
  margin-top: 1px;
}

.status-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--mint);
  box-shadow: 0 0 6px var(--mint);
}

.status-dot.offline {
  background: var(--gold);
  box-shadow: 0 0 6px var(--gold);
}

.chat-header-actions {
  display: flex;
  gap: 6px;
}

.chat-header-actions .icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 11px;
}

.chat-scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 8px 16px 6px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

.chat-scroll::-webkit-scrollbar {
  display: none;
}

.chat-day-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 7px 4px 15px;
  color: var(--muted-2);
  font-size: 9.5px;
  letter-spacing: 0.05em;
}

.chat-day-divider::before,
.chat-day-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(173, 195, 255, 0.13), transparent);
}

.msg-row {
  display: flex;
  gap: 7px;
  align-items: flex-end;
  margin-bottom: 13px;
  animation: msgIn 0.28s var(--ease-out) both;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg-row.user {
  justify-content: flex-end;
}

.msg-mini-avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  overflow: hidden;
  flex: 0 0 auto;
  opacity: 0.9;
  margin-bottom: 2px;
}

.msg-mini-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.msg-bubble {
  max-width: 83%;
  padding: 10px 13px;
  border-radius: 17px;
  font-size: 13px;
  line-height: 1.68;
  color: #d9e3f6;
  background: rgba(22, 37, 69, 0.88);
  border: 1px solid rgba(173, 195, 255, 0.1);
  border-bottom-left-radius: 6px;
  overflow-wrap: anywhere;
}

.msg-row.user .msg-bubble {
  border-radius: 17px;
  border-bottom-right-radius: 6px;
  color: #0a132b;
  background: linear-gradient(145deg, #d8e4ff, #a9c2ff);
  border-color: rgba(255, 255, 255, 0.2);
  box-shadow: 0 8px 20px -12px rgba(126, 157, 237, 0.7);
}

.msg-bubble p {
  margin: 0;
}

.msg-bubble p + p {
  margin-top: 7px;
}

.msg-bubble strong {
  color: #ffffff;
  font-weight: 630;
}

.msg-row.user .msg-bubble strong {
  color: #071026;
}

.msg-bubble .bullet {
  display: block;
  position: relative;
  padding-left: 12px;
}

.msg-bubble .bullet::before {
  content: "";
  position: absolute;
  left: 1px;
  top: 0.78em;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--accent);
}

.msg-row.user .msg-bubble .bullet::before {
  background: #3f5fa8;
}

.msg-time {
  margin-top: 4px;
  font-size: 8.5px;
  color: rgba(201, 215, 242, 0.42);
  text-align: right;
}

.msg-row.user .msg-time {
  color: rgba(7, 16, 38, 0.4);
}

/* 记账草稿 */

.entry-draft {
  margin-top: 9px;
  padding: 11px;
  border-radius: 13px;
  background: rgba(7, 15, 34, 0.5);
  border: 1px solid rgba(169, 194, 255, 0.15);
}

.entry-draft-top {
  display: flex;
  align-items: center;
  gap: 8px;
}

.entry-draft-icon {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: var(--cat-color, var(--accent));
  background: var(--cat-soft, rgba(169, 194, 255, 0.12));
}

.entry-draft-icon .icon {
  width: 16px;
  height: 16px;
}

.entry-draft-copy {
  flex: 1;
  min-width: 0;
}

.entry-draft-name {
  font-size: 11.5px;
  color: #e6edfa;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.entry-draft-meta {
  font-size: 9.5px;
  color: var(--muted-2);
  margin-top: 1px;
}

.entry-draft-amount {
  font-size: 13px;
  font-weight: 600;
  color: #f4f7ff;
  font-variant-numeric: tabular-nums;
}

.entry-draft-btn {
  width: 100%;
  margin-top: 9px;
  padding: 8px;
  border-radius: 10px;
  background: rgba(169, 194, 255, 0.94);
  color: #0b1430;
  font-size: 11.5px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.entry-draft-btn.added {
  background: rgba(125, 227, 208, 0.16);
  color: var(--mint);
}

.entry-draft-btn .icon {
  width: 13px;
  height: 13px;
}

.typing {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 17px;
  padding: 0 2px;
}

.typing span {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
  animation: typing 1.1s ease-in-out infinite;
}

.typing span:nth-child(2) { animation-delay: 0.15s; }
.typing span:nth-child(3) { animation-delay: 0.3s; }

@keyframes typing {
  0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-3px); }
}

.chat-suggestions {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 7px 16px 8px;
  flex: 0 0 auto;
  scrollbar-width: none;
}

.chat-suggestions::-webkit-scrollbar {
  display: none;
}

.suggestion {
  flex: 0 0 auto;
  padding: 6px 11px;
  border-radius: 999px;
  font-size: 10.5px;
  color: #bfcbe6;
  background: rgba(24, 39, 73, 0.7);
  border: 1px solid rgba(173, 195, 255, 0.12);
  white-space: nowrap;
  transition: all 0.16s ease;
}

.suggestion:active {
  background: rgba(169, 194, 255, 0.15);
  color: var(--accent);
}

.composer {
  flex: 0 0 auto;
  margin: 0 13px;
  padding: 6px 6px 6px 14px;
  display: flex;
  align-items: flex-end;
  gap: 7px;
  border-radius: 21px;
  background: rgba(23, 38, 72, 0.92);
  border: 1px solid rgba(173, 195, 255, 0.16);
  box-shadow: 0 14px 26px -18px rgba(0, 0, 0, 0.8);
}

.composer-input {
  flex: 1;
  min-height: 38px;
  max-height: 104px;
  padding: 8px 0 7px;
  font-size: 16px;
  line-height: 1.45;
  color: #eef3ff;
  resize: none;
  background: transparent;
}

.composer-input::placeholder {
  color: var(--muted-2);
  font-size: 12.5px;
}

.composer-mic,
.composer-send {
  width: 37px;
  height: 37px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  transition: all 0.18s var(--ease-out);
}

.composer-mic {
  color: var(--muted);
}

.composer-mic.listening {
  color: var(--pink);
  background: rgba(255, 173, 192, 0.1);
  animation: pulseMic 1.3s ease-in-out infinite;
}

.composer-send {
  color: #0b1430;
  background: linear-gradient(145deg, #dfe8ff, #a9c2ff);
  box-shadow: 0 4px 12px -4px rgba(128, 159, 240, 0.6);
}

.composer-send:active {
  transform: scale(0.92);
}

.composer-send:disabled {
  background: rgba(169, 194, 255, 0.16);
  color: var(--muted-2);
  box-shadow: none;
}

.composer-send .icon {
  width: 17px;
  height: 17px;
}

@keyframes pulseMic {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 173, 192, 0.15); }
  50% { box-shadow: 0 0 0 7px rgba(255, 173, 192, 0); }
}

.chat-footnote {
  flex: 0 0 auto;
  text-align: center;
  font-size: 8.5px;
  color: rgba(119, 134, 166, 0.62);
  padding: 5px 12px 0;
}

/* ---------- 遮罩与弹层 ---------- */

.overlay-root {
  position: absolute;
  inset: 0;
  z-index: 40;
  pointer-events: none;
}

.overlay {
  position: absolute;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(3, 7, 16, 0.62);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  opacity: 0;
  pointer-events: auto;
  transition: opacity 0.26s ease;
  padding: 0;
}

.overlay.show {
  opacity: 1;
}

.overlay.page {
  background: rgba(3, 7, 16, 0.4);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

.sheet,
.page-sheet {
  position: relative;
  width: 100%;
  max-width: 480px;
  background:
    radial-gradient(ellipse 100% 40% at 50% -10%, rgba(57, 82, 144, 0.24), transparent 55%),
    linear-gradient(180deg, #111c37 0%, #0d1730 100%);
  color: var(--text);
  box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.5);
}

.sheet {
  max-height: 93%;
  border-radius: 28px 28px 0 0;
  border-top: 1px solid rgba(184, 204, 255, 0.16);
  display: flex;
  flex-direction: column;
  transform: translateY(102%);
  transition: transform 0.45s var(--ease-spring);
  padding-bottom: var(--safe-bottom);
  overflow: hidden;
}

.overlay.show .sheet {
  transform: translateY(0);
}

.sheet-grabber {
  width: 35px;
  height: 4px;
  border-radius: 999px;
  background: rgba(186, 203, 241, 0.24);
  margin: 8px auto 0;
  flex: 0 0 auto;
}

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 20px 10px;
  flex: 0 0 auto;
}

.sheet-title {
  font-size: 17px;
  font-weight: 650;
  letter-spacing: -0.02em;
  color: #f4f7ff;
}

.sheet-sub {
  margin-top: 2px;
  font-size: 10.5px;
  color: var(--muted-2);
}

.sheet-close {
  width: 32px;
  height: 32px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.055);
  flex: 0 0 auto;
}

.sheet-close .icon {
  width: 16px;
  height: 16px;
}

.sheet-body {
  overflow-y: auto;
  padding: 2px 20px 16px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  scrollbar-width: none;
}

.sheet-body::-webkit-scrollbar {
  display: none;
}

.sheet-footer {
  flex: 0 0 auto;
  padding: 10px 20px 12px;
  border-top: 1px solid rgba(173, 195, 255, 0.08);
  background: rgba(12, 22, 43, 0.72);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.overlay.page .page-sheet {
  position: absolute;
  inset: 0;
  max-width: none;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse 100% 46% at 10% -8%, rgba(64, 91, 161, 0.26), transparent 55%),
    linear-gradient(176deg, #0a142c 0%, #081021 55%, #060c1b 100%);
  transform: translateX(102%);
  transition: transform 0.42s var(--ease-out);
  overflow: hidden;
}

.overlay.page.show .page-sheet {
  transform: translateX(0);
}

.page-sheet-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(12px + var(--safe-top)) 18px 10px;
  flex: 0 0 auto;
}

.page-back {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.055);
  border: 1px solid rgba(255, 255, 255, 0.06);
}

.page-back .icon {
  width: 17px;
  height: 17px;
}

.page-sheet-title {
  flex: 1;
  font-size: 17px;
  font-weight: 650;
  letter-spacing: -0.02em;
}

.page-sheet-body {
  flex: 1;
  overflow-y: auto;
  padding: 4px 20px calc(28px + var(--safe-bottom));
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  scrollbar-width: none;
}

.page-sheet-body::-webkit-scrollbar {
  display: none;
}

/* ---------- 记账表单 ---------- */

.txn-type-toggle {
  margin-bottom: 13px;
}

.expense-active .txn-type-toggle .segmented button[data-type="expense"],
.income-active .txn-type-toggle .segmented button[data-type="income"] {
  color: #0d1731;
  background: var(--accent);
}

.amount-input-wrap {
  display: flex;
  align-items: baseline;
  gap: 7px;
  padding: 6px 2px 12px;
  border-bottom: 1px solid rgba(173, 195, 255, 0.13);
}

.amount-currency {
  font-size: 24px;
  font-weight: 500;
  color: var(--muted);
  transform: translateY(-4px);
}

.amount-input {
  flex: 1;
  min-width: 0;
  font-size: clamp(37px, 12vw, 45px);
  font-weight: 650;
  letter-spacing: -0.04em;
  line-height: 1.15;
  color: #f7f9ff;
  font-variant-numeric: tabular-nums;
  padding: 0;
}

.amount-input::placeholder {
  color: rgba(137, 153, 185, 0.35);
}

.amount-hint {
  font-size: 9.5px;
  color: var(--muted-2);
  padding: 7px 2px 0;
  min-height: 23px;
}

.amount-hint.smart {
  color: var(--accent);
}

.field-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 15px 0 8px;
  font-size: 10.5px;
  color: var(--muted);
}

.field-label .label-extra {
  color: var(--muted-2);
  font-size: 9.5px;
}

.cat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}

.cat-option {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 64px;
  padding: 8px 3px;
  border-radius: 14px;
  color: var(--cat-color);
  background: rgba(21, 35, 64, 0.55);
  border: 1px solid rgba(173, 195, 255, 0.08);
  font-size: 10px;
  transition: all 0.16s var(--ease-out);
}

.cat-option .icon {
  width: 19px;
  height: 19px;
}

.cat-option span {
  color: var(--muted);
}

.cat-option.selected {
  background: var(--cat-soft);
  border-color: color-mix(in srgb, var(--cat-color) 45%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cat-color) 18%, transparent);
}

.cat-option.selected span {
  color: #eef3ff;
}

.cat-option:active {
  transform: scale(0.94);
}

.account-chips {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  scrollbar-width: none;
  padding-bottom: 2px;
}

.account-chips::-webkit-scrollbar {
  display: none;
}

.account-chip {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 11px;
  border-radius: 10px;
  color: var(--muted);
  background: rgba(21, 35, 64, 0.55);
  border: 1px solid rgba(173, 195, 255, 0.08);
  font-size: 11px;
  transition: all 0.16s ease;
}

.account-chip i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
}

.account-chip.selected {
  color: #eef3ff;
  border-color: rgba(169, 194, 255, 0.32);
  background: rgba(169, 194, 255, 0.1);
}

.input-shell {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 43px;
  padding: 0 12px;
  border-radius: 13px;
  background: rgba(21, 35, 64, 0.58);
  border: 1px solid rgba(173, 195, 255, 0.09);
  transition: border-color 0.18s ease;
}

.input-shell:focus-within {
  border-color: rgba(169, 194, 255, 0.32);
}

.input-shell .icon {
  width: 16px;
  height: 16px;
  color: var(--muted-2);
}

.input-shell input {
  flex: 1;
  min-width: 0;
  height: 41px;
  font-size: 16px;
  color: #eef3ff;
}

.input-shell input[type="date"] {
  color-scheme: dark;
  font-size: 16px;
}

.form-row {
  display: flex;
  gap: 8px;
}

.form-row > * {
  flex: 1;
  min-width: 0;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 17px;
  border-radius: 14px;
  font-size: 13.5px;
  font-weight: 560;
  transition: transform 0.16s var(--ease-out), opacity 0.16s ease;
}

.btn .icon {
  width: 16px;
  height: 16px;
}

.btn:active {
  transform: scale(0.97);
}

.btn-primary {
  width: 100%;
  color: #081128;
  background: linear-gradient(145deg, #e2ebff, #a9c2ff 58%, #86a5ee);
  box-shadow: 0 10px 24px -12px rgba(139, 170, 247, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.55);
}

.btn-soft {
  color: var(--accent);
  background: rgba(169, 194, 255, 0.09);
  border: 1px solid rgba(169, 194, 255, 0.12);
}

.btn-ghost {
  color: var(--muted);
  background: rgba(255, 255, 255, 0.045);
  border: 1px solid rgba(255, 255, 255, 0.06);
}

.btn-danger {
  color: var(--danger);
  background: rgba(255, 143, 163, 0.08);
  border: 1px solid rgba(255, 143, 163, 0.14);
}

.btn-delete {
  width: 44px;
  min-width: 44px;
  padding: 0;
}

/* ---------- 详情 ---------- */

.detail-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 0 19px;
}

.detail-icon {
  width: 62px;
  height: 62px;
  border-radius: 21px;
  display: grid;
  place-items: center;
  color: var(--cat-color);
  background: var(--cat-soft);
  border: 1px solid rgba(255, 255, 255, 0.06);
  margin-bottom: 11px;
}

.detail-icon .icon {
  width: 28px;
  height: 28px;
}

.detail-amount {
  font-size: 33px;
  font-weight: 660;
  letter-spacing: -0.04em;
  color: #f5f8ff;
  font-variant-numeric: tabular-nums;
}

.detail-amount.income {
  color: var(--mint);
}

.detail-name {
  margin-top: 4px;
  font-size: 12.5px;
  color: var(--muted);
}

.detail-rows {
  border-radius: 15px;
  overflow: hidden;
  background: rgba(21, 35, 64, 0.5);
  border: 1px solid rgba(173, 195, 255, 0.08);
}

.detail-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 14px;
  font-size: 11.5px;
}

.detail-row + .detail-row {
  border-top: 1px solid rgba(173, 195, 255, 0.06);
}

.detail-row dt {
  color: var(--muted-2);
}

.detail-row dd {
  margin: 0;
  color: #e5ebf8;
  text-align: right;
}

.detail-actions {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.detail-actions .btn {
  flex: 1;
}

/* ---------- 设置页 ---------- */

.profile-card {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 16px;
  margin: 4px 0 19px;
  border-radius: var(--radius-lg);
  background:
    radial-gradient(circle at 100% 0, rgba(143, 185, 255, 0.16), transparent 46%),
    linear-gradient(150deg, rgba(28, 45, 82, 0.9), rgba(15, 26, 51, 0.94));
  border: 1px solid var(--line);
}

.profile-avatar {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid rgba(255, 255, 255, 0.14);
  box-shadow: 0 0 24px rgba(121, 153, 239, 0.25);
  flex: 0 0 auto;
}

.profile-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.profile-name {
  font-size: 16px;
  font-weight: 650;
  letter-spacing: -0.02em;
}

.profile-sub {
  margin-top: 2px;
  font-size: 10.5px;
  color: var(--muted-2);
}

.profile-badge {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  border-radius: 999px;
  color: var(--gold);
  background: rgba(255, 217, 142, 0.08);
  border: 1px solid rgba(255, 217, 142, 0.12);
  font-size: 9px;
  white-space: nowrap;
}

.settings-group {
  margin-bottom: 19px;
}

.settings-label {
  padding: 0 4px;
  margin-bottom: 8px;
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--muted-2);
  text-transform: uppercase;
}

.settings-card {
  border-radius: var(--radius-md);
  overflow: hidden;
  background: rgba(19, 32, 61, 0.72);
  border: 1px solid var(--line);
}

.settings-row {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  min-height: 52px;
  padding: 10px 13px;
  text-align: left;
  transition: background 0.15s ease;
}

.settings-row:active {
  background: rgba(255, 255, 255, 0.035);
}

.settings-row + .settings-row {
  border-top: 1px solid rgba(173, 195, 255, 0.07);
}

.settings-row-icon {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  color: var(--row-color, var(--accent));
  background: var(--row-bg, rgba(169, 194, 255, 0.09));
  flex: 0 0 auto;
}

.settings-row-icon .icon {
  width: 15px;
  height: 15px;
}

.settings-row-copy {
  flex: 1;
  min-width: 0;
}

.settings-row-title {
  font-size: 12.5px;
  color: #e7edf9;
}

.settings-row-desc {
  margin-top: 1px;
  font-size: 9.5px;
  color: var(--muted-2);
  line-height: 1.5;
}

.settings-row-value {
  display: flex;
  align-items: center;
  gap: 3px;
  flex: 0 0 auto;
  font-size: 11px;
  color: var(--muted-2);
}

.settings-row-value .icon {
  width: 14px;
  height: 14px;
  color: var(--muted-2);
}

.settings-budget {
  font-variant-numeric: tabular-nums;
  color: var(--gold);
}

.plugin-row {
  align-items: flex-start;
}

.plugin-row .settings-row-icon {
  border-radius: 10px;
}

.plugin-top {
  display: flex;
  align-items: center;
  gap: 6px;
}

.plugin-name {
  font-size: 12.5px;
  color: #e7edf9;
}

.plugin-tag {
  font-size: 8px;
  color: var(--accent);
  background: rgba(169, 194, 255, 0.09);
  border: 1px solid rgba(169, 194, 255, 0.1);
  border-radius: 4px;
  padding: 1px 4px;
}

.plugin-desc {
  margin-top: 3px;
  padding-right: 4px;
  font-size: 9.5px;
  line-height: 1.55;
  color: var(--muted-2);
}

.switch {
  position: relative;
  width: 42px;
  height: 25px;
  flex: 0 0 auto;
  margin-top: 4px;
}

.switch input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}

.switch-track {
  position: absolute;
  inset: 0;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.06);
  transition: background 0.22s ease;
}

.switch-track::after {
  content: "";
  position: absolute;
  width: 19px;
  height: 19px;
  left: 2px;
  top: 2px;
  border-radius: 50%;
  background: #c6d0e4;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
  transition: transform 0.24s var(--ease-spring), background 0.2s ease;
}

.switch input:checked + .switch-track {
  background: linear-gradient(135deg, #a9c2ff, #7597ea);
}

.switch input:checked + .switch-track::after {
  transform: translateX(17px);
  background: #ffffff;
}

.switch input:focus-visible + .switch-track {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.danger-zone .settings-row-title {
  color: var(--danger);
}

.settings-footer {
  padding: 9px 8px 5px;
  text-align: center;
  color: var(--muted-2);
  font-size: 9px;
  line-height: 1.8;
}

.settings-footer .signature {
  color: rgba(169, 194, 255, 0.65);
  font-family: "New York", Georgia, "Songti SC", serif;
  font-style: italic;
  font-size: 11px;
}

/* AI 设置 */

.ai-mode-cards {
  display: grid;
  gap: 8px;
  margin-bottom: 17px;
}

.ai-mode-card {
  display: flex;
  gap: 11px;
  align-items: flex-start;
  padding: 12px;
  border-radius: 14px;
  background: rgba(21, 35, 64, 0.55);
  border: 1px solid rgba(173, 195, 255, 0.09);
  text-align: left;
  transition: all 0.18s ease;
}

.ai-mode-card.selected {
  border-color: rgba(169, 194, 255, 0.38);
  background: rgba(169, 194, 255, 0.08);
}

.ai-mode-icon {
  width: 31px;
  height: 31px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  color: var(--accent);
  background: rgba(169, 194, 255, 0.1);
}

.ai-mode-card.local .ai-mode-icon {
  color: var(--mint);
  background: rgba(125, 227, 208, 0.09);
}

.ai-mode-title {
  font-size: 12px;
  color: #eaf0fc;
  display: flex;
  align-items: center;
  gap: 5px;
}

.ai-mode-desc {
  margin-top: 2px;
  font-size: 9.5px;
  color: var(--muted-2);
  line-height: 1.55;
}

.ai-form {
  display: none;
}

.ai-form.visible {
  display: block;
}

.field-block {
  margin-bottom: 12px;
}

.field-block-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  font-size: 10px;
  color: var(--muted);
}

.field-block-label span {
  color: var(--muted-2);
  font-size: 9px;
}

.field-block .input-shell {
  border-radius: 11px;
}

.field-block .input-shell input {
  font-size: 13px;
}

.ai-note {
  display: flex;
  gap: 7px;
  padding: 10px 11px;
  border-radius: 11px;
  background: rgba(169, 194, 255, 0.055);
  border: 1px solid rgba(169, 194, 255, 0.08);
  color: var(--muted-2);
  font-size: 9.5px;
  line-height: 1.65;
  margin: 13px 0;
}

.ai-note .icon {
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin-top: 1px;
  color: var(--accent);
}

.ai-status {
  min-height: 18px;
  font-size: 10px;
  color: var(--muted-2);
  margin-top: 7px;
}

.ai-status.ok { color: var(--mint); }
.ai-status.err { color: var(--danger); }

/* 周期账单管理 */

.sub-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.sub-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px;
  border-radius: 13px;
  background: rgba(21, 35, 64, 0.55);
  border: 1px solid rgba(173, 195, 255, 0.08);
}

.sub-icon {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  color: var(--cat-color);
  background: var(--cat-soft);
  flex: 0 0 auto;
}

.sub-icon .icon {
  width: 16px;
  height: 16px;
}

.sub-copy {
  flex: 1;
  min-width: 0;
}

.sub-name {
  font-size: 12px;
  color: #e8eefb;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sub-meta {
  margin-top: 1px;
  font-size: 9.5px;
  color: var(--muted-2);
}

.sub-amount {
  font-size: 11.5px;
  color: #e9eef9;
  font-variant-numeric: tabular-nums;
}

.sub-pay {
  padding: 5px 8px;
  border-radius: 8px;
  font-size: 9.5px;
  color: var(--accent);
  background: rgba(169, 194, 255, 0.09);
  border: 1px solid rgba(169, 194, 255, 0.12);
  white-space: nowrap;
}

.sub-empty {
  padding: 18px 10px;
  text-align: center;
  color: var(--muted-2);
  font-size: 10.5px;
}

.sub-form {
  margin-top: 15px;
  padding-top: 14px;
  border-top: 1px solid rgba(173, 195, 255, 0.08);
}

.sub-form-title {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 9px;
}

/* 确认弹层 */

.confirm-sheet {
  padding: 22px 20px calc(18px + var(--safe-bottom));
  text-align: center;
}

.confirm-icon {
  width: 48px;
  height: 48px;
  border-radius: 16px;
  margin: 0 auto 10px;
  display: grid;
  place-items: center;
  color: var(--danger);
  background: rgba(255, 143, 163, 0.09);
  border: 1px solid rgba(255, 143, 163, 0.12);
}

.confirm-icon .icon {
  width: 22px;
  height: 22px;
}

.confirm-title {
  font-size: 16px;
  font-weight: 640;
  color: #f4f7ff;
}

.confirm-desc {
  margin: 6px auto 18px;
  max-width: 290px;
  font-size: 11px;
  color: var(--muted-2);
  line-height: 1.7;
}

.confirm-actions {
  display: flex;
  gap: 8px;
}

.confirm-actions .btn {
  flex: 1;
}

/* ---------- Toast ---------- */

.toast-root {
  position: absolute;
  left: 50%;
  top: calc(14px + var(--safe-top));
  transform: translateX(-50%);
  z-index: 80;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  pointer-events: none;
  width: max-content;
  max-width: calc(100% - 40px);
}

.toast {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 15px;
  border-radius: 999px;
  background: rgba(246, 241, 231, 0.97);
  color: #12203d;
  font-size: 11.5px;
  font-weight: 520;
  box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.55);
  opacity: 0;
  transform: translateY(-9px) scale(0.97);
  transition: all 0.28s var(--ease-spring);
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.toast .icon {
  width: 14px;
  height: 14px;
  color: #5374c4;
  stroke-width: 2.1;
}

.toast.warn {
  background: rgba(255, 222, 227, 0.98);
  color: #5d1d2b;
}

.toast.warn .icon {
  color: #d55a72;
}

/* ---------- 小工具类 ---------- */

.mt-6 { margin-top: 6px; }
.mt-10 { margin-top: 10px; }
.mt-14 { margin-top: 14px; }
.mb-10 { margin-bottom: 10px; }
.text-muted { color: var(--muted); }
.text-center { text-align: center; }
.hidden { display: none !important; }
.no-select { user-select: none; -webkit-user-select: none; }

.file-input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

/* ---------- 加载占位 ---------- */

.skeleton {
  position: relative;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 8px;
}

.skeleton::after {
  content: "";
  position: absolute;
  inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.055), transparent);
  animation: shimmer 1.4s infinite;
}

@keyframes shimmer {
  to { transform: translateX(100%); }
}

/* ---------- 桌面 / iPad ---------- */

@media (min-width: 880px) and (min-height: 620px) and (hover: hover) and (pointer: fine) {
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(42px, 8vw, 120px);
    padding: 24px;
  }

  .desktop-brand {
    display: block;
    position: relative;
    flex: 0 0 auto;
    width: min(360px, 30vw);
    z-index: 2;
    pointer-events: none;
  }

  .brand-eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #9db1d9;
    font-size: 10px;
    letter-spacing: 0.18em;
  }

  .brand-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 10px var(--gold);
  }

  .desktop-brand h1 {
    margin-top: 18px;
    font-family: "Songti SC", "Noto Serif SC", "New York", Georgia, serif;
    font-size: clamp(32px, 3.2vw, 46px);
    font-weight: 500;
    line-height: 1.3;
    letter-spacing: -0.04em;
    color: #f0f3fa;
  }

  .desktop-brand p {
    margin-top: 16px;
    color: #8d9cbd;
    font-size: 12.5px;
    line-height: 2;
  }

  .brand-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 22px;
  }

  .brand-chips span {
    padding: 5px 9px;
    border-radius: 999px;
    border: 1px solid rgba(169, 194, 255, 0.14);
    background: rgba(169, 194, 255, 0.05);
    color: #aab9d6;
    font-size: 9.5px;
    letter-spacing: 0.03em;
  }

  .brand-orbit {
    position: absolute;
    right: -135px;
    top: -120px;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    overflow: hidden;
    opacity: 0.24;
    -webkit-mask-image: radial-gradient(circle, #000 30%, transparent 69%);
    mask-image: radial-gradient(circle, #000 30%, transparent 69%);
  }

  .brand-orbit img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .brand-foot {
    margin-top: 36px;
    color: rgba(121, 140, 176, 0.5);
    font-size: 8.5px;
    letter-spacing: 0.16em;
  }

  .app-shell {
    width: 430px;
    height: min(900px, calc(100dvh - 48px));
    margin: 0;
    border-radius: 42px;
    border: 1px solid rgba(194, 211, 255, 0.14);
    box-shadow:
      0 50px 120px -35px rgba(0, 0, 0, 0.85),
      0 0 0 8px rgba(14, 24, 46, 0.7),
      0 0 90px -30px rgba(77, 110, 188, 0.4);
  }

  .app-shell::before {
    content: "";
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 76px;
    height: 21px;
    border-radius: 999px;
    background: #030711;
    z-index: 30;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
  }

  .screen {
    padding-top: 30px;
  }

  .screen[data-screen="assistant"].active {
    padding-top: 18px;
  }

  .overlay-root {
    border-radius: inherit;
    overflow: hidden;
  }

  .sheet,
  .page-sheet {
    max-width: 430px;
  }

  .overlay.page .page-sheet {
    max-width: none;
    border-radius: 0 0 42px 42px;
  }

  .tabbar {
    left: 13px;
    right: 13px;
  }

  .toast-root {
    top: 31px;
  }

}

@media (min-width: 1280px) and (hover: hover) and (pointer: fine) {
  .desktop-brand {
    width: 390px;
  }

  body {
    gap: 120px;
  }
}

/* 小屏与矮屏 */

@media (max-height: 680px) {
  .balance-card {
    min-height: 178px;
    padding-top: 17px;
  }

  .hero-stats {
    margin-top: 14px;
  }

  .quick-grid {
    margin: 12px 0 15px;
  }

  .section {
    margin-bottom: 17px;
  }

  .chat-header {
    padding-bottom: 7px;
  }
}

@media (max-width: 360px) {
  .screen {
    padding-left: 16px;
    padding-right: 16px;
  }

  .hero-stats {
    max-width: 82%;
  }

  .hero-stat {
    padding: 8px;
  }

  .quick-action {
    font-size: 10.5px;
  }

  .tabbar {
    left: 9px;
    right: 9px;
  }

  .sheet-head,
  .sheet-body,
  .sheet-footer {
    padding-left: 16px;
    padding-right: 16px;
  }
}

/* ---------- 动效偏好 ---------- */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }

  .star {
    opacity: 0.4;
  }
}

/* 防止 iOS 横屏刘海遮挡 */
@supports (padding: max(0px)) {
  .tabbar {
    left: max(14px, env(safe-area-inset-left));
    right: max(14px, env(safe-area-inset-right));
  }
}

   运行中补充的组件细节
   ========================================================= */

.recurring-sub,
.sub-name,
.sub-meta,
.entry-draft-name,
.entry-draft-meta,
.settings-row-title,
.settings-row-desc,
.ai-mode-title,
.ai-mode-desc {

  gap: 6px;
  padding: 8px 0 4px;
  color: rgba(128, 146, 181, 0.5);
  font-size: 9.5px;
  letter-spacing: 0.08em;
}

.home-footer .icon {
  color: rgba(255, 217, 142, 0.46);
}

.sheet-body {
  flex: 1 1 auto;
  min-height: 0;
}

.chat-scroll {
  min-height: 0;
}

.mt-8 { margin-top: 8px; }

.sub-del {

  place-items: center;

.sub-del:active {

}

.select-shell {

.select-shell::after {

.select-shell select {

.select-shell select option {

}

.ai-mode-card > span:last-child {
  flex: 1;
  min-width: 0;
}

.ai-mode-title {
  display: flex;
  align-items: center;
  gap: 5px;
}

.field-block .input-shell input {
  font-size: 16px;
}

.amount-hint {
  transition: color 0.18s ease;
}

button:focus-visible,
[role="button"]:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 2px solid rgba(169, 194, 255, 0.65);
  outline-offset: 2px;
}

/* 更贴近 iOS 的细节：按钮按压、滚动回弹 */
.txn-row,
.settings-row,
.sub-pay,
.quick-action,
.chip,
.suggestion {
  -webkit-tap-highlight-color: transparent;
}

.screen,
.chat-scroll,
.sheet-body,
.page-sheet-body {
  scroll-behavior: smooth;
}

@media (max-width: 380px) {
  .sub-item {
    gap: 7px;
    padding: 9px;
  }

  .sub-item .sub-pay {
    padding: 5px 6px;
    font-size: 9px;
  }

  .sub-item .sub-del {
    display: none;
  }
}

/* ---------- 软键盘与 iOS 输入适配 ---------- */

.overlay {
  padding-bottom: var(--keyboard-inset, 0px);
}

.tabbar {
  transition: opacity 0.2s ease, transform 0.28s var(--ease-out);
}

@media (max-width: 879px) {
  .sheet {
    max-height: min(93%, calc(100dvh - var(--keyboard-inset, 0px) - 12px));
  }

  body.keyboard-open .tabbar {
    opacity: 0;
    transform: translateY(calc(100% + 28px));
    pointer-events: none;
  }

  body.keyboard-open .chat-suggestions,
  body.keyboard-open .chat-footnote {
    display: none;
  }

  body.keyboard-open .screen[data-screen="assistant"].active {
    padding-bottom: calc(8px + var(--safe-bottom) + var(--keyboard-inset, 0px));
  }

  body.keyboard-open .screen[data-screen="assistant"] .composer {
    margin-bottom: 4px;
  }
}

/* ---------- 可滚动提示与底部渐隐 ---------- */

.chip-scroll,
.chat-suggestions {
  -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 calc(100% - 26px), transparent 100%);
  mask-image: linear-gradient(90deg, #000 0%, #000 calc(100% - 26px), transparent 100%);
}

.search-input:placeholder-shown + .search-clear {
  opacity: 0;
  pointer-events: none;
}

.search-clear {
  transition: opacity 0.16s ease;
}

.app-shell::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: calc(108px + var(--safe-bottom));
  z-index: 15;
  pointer-events: none;
  background: linear-gradient(
    to top,
    #060c1b 0%,
    rgba(6, 12, 27, 0.9) 42%,
    rgba(6, 12, 27, 0.46) 72%,
    transparent 100%
  );
}

.tabbar {
  background: rgba(13, 23, 46, 0.93);
}

/* 聊天小建议更轻一点 */
.suggestion {
  font-size: 10px;
  padding: 6px 10px;
}

.msg-bubble .line {
  display: block;
  min-height: 1em;
}

/* 去掉 Safari / Chrome 自带的搜索清除按钮，只保留鲸迹自己的 */
input[type="search"]::-webkit-search-cancel-button,
input[type="search"]::-webkit-search-decoration,
input[type="search"]::-webkit-search-results-button,
input[type="search"]::-webkit-search-results-decoration {
  -webkit-appearance: none;
  appearance: none;
  display: none;
}

.managed-ai-custom-link:active {

.managed-ai-return {

  justify-content: center;
  gap: 5px;

  padding: 9px;

  color: var(--mint);
  background: rgba(125, 227, 208, 0.07);
  border: 1px solid rgba(125, 227, 208, 0.12);
  font-size: 10.5px;
}

.managed-ai-return .icon {
  width: 14px;
  height: 14px;
}

.ai-offline-note {
  margin-top: 8px;
